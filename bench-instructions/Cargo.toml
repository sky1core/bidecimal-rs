[package]
name = "bidecimal-instructions"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[dev-dependencies]
bidecimal = { path = ".." }
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
gungraun = { version = "=0.20.0", features = ["cachegrind"] }
num-bigint = "=0.5.1"

[[bench]]
name = "instructions"
harness = false
